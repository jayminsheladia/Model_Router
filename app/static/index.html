<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model Router</title>
  <link rel="stylesheet" href="/style.css" />
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header>
    <div class="header-text">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Model Router</h1>
      </div>
      <p class="tagline">Policy-aware LLM routing &mdash; who's asking, what they're allowed to spend, and why every decision happened.</p>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="icon icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <main>
    <section class="panel" id="route-panel">
      <h2>Route a request</h2>
      <form id="route-form">
        <label>
          User
          <select id="user-select" required></select>
        </label>
        <label>
          Project <span class="hint">(required for restricted users)</span>
          <input type="text" id="project-input" placeholder="e.g. internal-tools" />
          <span class="hint" id="restricted-projects-hint"></span>
        </label>
        <label>
          Routing mode
          <select id="routing-mode-select">
            <option value="balanced" selected>Balanced</option>
            <option value="quality">Quality</option>
            <option value="cost">Cost</option>
          </select>
        </label>
        <label>
          Prompt
          <textarea id="prompt-input" rows="4" required placeholder="e.g. refactor this function to be async"></textarea>
          <span class="hint">Tip: include [[simulate-outage:frontier]] (or mid/cheap) in the prompt to test automatic failover.</span>
        </label>
        <label class="checkbox-row" id="continue-conversation-row" hidden>
          <input type="checkbox" id="continue-conversation-checkbox" checked />
          <span id="continue-conversation-label">Continue this conversation</span>
        </label>
        <button type="submit">Route request</button>
      </form>

      <div id="conversation-thread" class="conversation-thread hidden"></div>
      <div id="result" class="result hidden"></div>
    </section>

    <section class="panel" id="budgets-panel">
      <h2>Budgets</h2>
      <div id="budgets-list"></div>
    </section>

    <section class="panel wide" id="audit-panel">
      <div class="panel-header">
        <h2>Audit trail</h2>
        <button id="refresh-audit" class="secondary">Refresh</button>
      </div>
      <div class="table-scroll">
        <table id="audit-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>User</th>
              <th>Project</th>
              <th>Complexity &rarr; Tier</th>
              <th>Outcome</th>
              <th>Reason</th>
              <th>Cost</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
